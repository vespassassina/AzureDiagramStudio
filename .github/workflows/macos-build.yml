name: Build macOS ARM64 release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to receive the macOS ZIP
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run desktop:pack:mac
        working-directory: app
      - run: gh release upload "${{ inputs.tag }}" "release/Azure-Diagram-Studio-0.1.0-mac-arm64.zip" --clobber
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
